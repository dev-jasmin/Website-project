<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#171717" />
  <title>Account — Ember</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../styles/auth.css"/>
</head>
<body>
  <main class="auth-card">
    <div class="logo">
      <img src="../images/logo/logo-cream white.png" alt="">
    </div>

    <section class="auth-form" id="loginPanel">
      <h2>Log in</h2>
      <p class="auth-intro">Return to your saved scents, rewards, and Ember account.</p>

      <form action="auth.php" method="post">
        <input type="hidden" name="mode" value="login" />

        <div class="field-group">
          <label for="loginUsername">Username or email</label>
          <input id="loginUsername" name="username_or_email" type="text" autocomplete="username" placeholder="Enter your username or email" required />
        </div>

        <div class="field-group">
          <label for="loginPassword">Password</label>
          <div class="password-field">
            <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required />
            
            <button type="button" class="show-password" data-target="loginPassword">Show</button>
          </div>
        </div>
        
        <div class="checkbox-row">
          <label class="checkbox-label">
            <input type="checkbox" name="remember" /> <span>Remember me</span>
          </label>
          
          <a class="small-link" href="#">Forgot password?</a>
        </div>

        <button class="auth-button" type="submit">Log in</button>
      </form>
    </section>

    <section class="auth-form hidden" id="signupPanel">
      <h2>Sign up</h2>
      <p class="auth-intro">Create your Ember account and keep close to your favorite scents.</p>

      <form action="auth.php" method="post" id="signupForm">
        <input type="hidden" name="mode" value="signup" />

        <div class="field-group">
          <label for="signupUsername">Username</label>
          <input id="signupUsername" name="username" type="text" autocomplete="username" placeholder="Create a username" required />
        </div>

        <div class="field-group">
          <label for="signupEmail">Email address</label>
          <input id="signupEmail" name="email" type="email" autocomplete="email" placeholder="Enter your email" required />
        </div>

        <div class="field-group">
          <label for="signupPassword">Password</label>
          <div class="password-field">
            <input id="signupPassword" name="password" type="password" autocomplete="new-password" placeholder="Create a password" minlength="8" required />
            <button type="button" class="show-password" data-target="signupPassword">Show</button>
          </div>
        </div>

        <div class="field-group">
          <label for="confirmPassword">Confirm password</label>
          <div class="password-field">
            <input id="confirmPassword" name="confirm_password" type="password" autocomplete="new-password" placeholder="Confirm your password" minlength="8" required/>
            
            <button type="button" class="show-password" data-target="confirmPassword">Show</button>
          </div>
        </div>

        <label class="checkbox-label">
          <input type="checkbox" name="terms" required /> <span>I agree to Ember’s 
            <a class="small-link" href="#">terms and privacy policy</a>.</span>
        </label>

        <button class="auth-button" type="submit">Create account</button>
      </form>
    </section>

    <p class="form-status" id="formStatus" role="status"></p>
    <p class="switch-account" id="switchText">Don’t have an account? 
      <a href="#" data-switch="signup">Sign up</a>
    </p>

    <a class="back-link" href="../index.html">Back to home</a>
  </main>

  <script src="../scripts/auth.js"></script>
</body>
</html>
